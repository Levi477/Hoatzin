[package]
name = "hoatzin"
version = "0.1.0"
edition = "2024"

[dependencies]
pyo3 = { version = "0.28.3", features = ["auto-initialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
uuid = { version = "1.23.1", features = ["v4","fast-rng"] }
